[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ergoshear-website"
version = "0.1.0"
description = "A simple FastAPI landing page for ergoshear.dev."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3",
    "ruff>=0.11,<1",
    "yamllint>=1.35,<2",
]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.ruff]
target-version = "py310"
line-length = 88
